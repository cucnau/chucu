name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Thay bằng tên nhánh chính của bạn nếu là master hoặc dev

# Thiết lập quyền hạn để có thể deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt thư viện dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Biên dịch ứng dụng (Build)
        run: npm run build

      - name: Cấu hình Pages
        uses: actions/configure-pages@v4

      - name: Tải bản build (dist) lên artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
